<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">

    <div class="weather-card">

      <h1>Weather App</h1>

      <!-- Search -->
      <div class="search-box">
        <input type="text" placeholder="Enter city name" id="cityInput">
        <button id="searchBtn">Search</button>
      </div>

      <!-- Error -->
      <p class="error-msg" id="errorMsg">City not found</p>

      <!-- Weather Info -->
      <div class="weather-info" id="weatherInfo">

        <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png"
             alt="weather icon"
             class="weather-icon"
             id="weatherIcon">

        <h2 id="cityName">Hyderabad</h2>

        <h3 id="temperature">28°C</h3>

        <p id="condition">Cloudy</p>

        <div class="details">

          <div class="detail-box">
            <span>💧</span>
            <p id="humidity">65%</p>
            <small>Humidity</small>
          </div>

          <div class="detail-box">
            <span>🌬️</span>
            <p id="wind">12 km/h</p>
            <small>Wind Speed</small>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
